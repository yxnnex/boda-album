<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Azabache 💍</title>
  
  <!-- Fuentes de Google: Great Vibes (Cursiva romántica) + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Widget de Subida de Cloudinary -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf8f5; }
    .font-cursive { font-family: 'Great Vibes', cursive; }
  </style>
</head>
<body class="min-h-screen text-gray-800 pb-20">

  <!-- Header Superior Fijo -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-rose-100 px-4 py-3 flex justify-between items-center shadow-sm">
    <span class="font-cursive text-2xl text-rose-900 font-bold">Bodas de Azabache</span>
    <button id="upload_widget" class="bg-gradient-to-r from-rose-500 to-pink-600 text-white px-4 py-2 rounded-full font-medium text-xs tracking-wider shadow-md hover:scale-105 transition-all flex items-center gap-1.5">
      <span>✨</span> Subir Recuerdo
    </button>
  </header>

  <!-- Banner / Bienvenida -->
  <section class="max-w-md mx-auto pt-8 px-4 text-center">
    <h1 class="font-cursive text-5xl text-rose-900 mb-1 leading-tight">Bodas de Azabache</h1>
    <p class="text-xs font-semibold uppercase tracking-widest text-amber-700 mb-3">29 de Agosto de 2026</p>
    <div class="w-12 h-[1px] bg-amber-300 mx-auto mb-4"></div>
    <p class="text-sm text-gray-600 italic leading-relaxed">
      Comparte tus fotos con todos nosotros, sube tus fotos y videos. <br>
      <span class="font-serif font-semibold text-rose-800 not-italic">¡Salud! 🥂</span>
    </p>
  </section>

  <!-- Feed Principal -->
  <main class="max-w-md mx-auto mt-6 px-3 space-y-6" id="feed">
    <div class="text-center text-rose-800/50 mt-10" id="loading">
      <p class="animate-pulse font-cursive text-xl">Cargando momentos especiales...</p>
    </div>
  </main>

  <!-- Script Firebase + Lógica de Renderizado -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcWss9c7FqrHZe0wBVEVxxKkj8JZjKcEs",
      authDomain: "boda-album-2c21b.firebaseapp.com",
      projectId: "boda-album-2c21b",
      storageBucket: "boda-album-2c21b.firebasestorage.app",
      messagingSenderId: "753137838470",
      appId: "1:753137838470:web:8a238ceac201a12cfde407"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Widget Cloudinary (Soporta Fotos + Videos)
    const myWidget = cloudinary.createUploadWidget({
      cloudName: 'dz6bcpnj', 
      uploadPreset: 'yofsbhq3',
      sources: ['local', 'camera'],
      resourceType: 'auto',
      clientAllowedFormats: ['image', 'video'], 
      multiple: false,
      styles: {
        palette: {
          window: "#FFFFFF",
          windowBorder: "#E5E7EB",
          tabIcon: "#E11D48",
          menuBg: "#FFFFFF",
          textDark: "#1F2937",
          action: "#E11D48",
          inProgress: "#F43F5E",
          complete: "#10B981",
          error: "#EF4444"
        }
      }
    }, (error, result) => {
        if (!error && result && result.event === "success") {
          const nombre = prompt("Tu nombre o apodo:") || "Invitado especial";
          const mensaje = prompt("Escribe una dedicatoria (opcional):") || "";
          
          addDoc(collection(db, "fotos"), {
            url: result.info.secure_url,
            tipo: result.info.resource_type,
            nombre: nombre,
            mensaje: mensaje,
            fecha: serverTimestamp()
          });
        }
    });

    document.getElementById("upload_widget").addEventListener("click", () => myWidget.open(), false);

    // Escuchador en vivo
    const q = query(collection(db, "fotos"), orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
      const feed = document.getElementById("feed");
      feed.innerHTML = "";
      
      if (snapshot.empty) {
        feed.innerHTML = `
          <div class="text-center py-10 px-4 bg-white/70 border border-rose-100 rounded-2xl shadow-sm">
            <p class="font-cursive text-2xl text-rose-900 mb-1">Aún no hay recuerdos</p>
            <p class="text-xs text-gray-500">Sé la primera persona en compartir una foto o video.</p>
          </div>
        `;
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const fechaFormateada = data.fecha ? new Date(data.fecha.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Reciente';
        
        const esVideo = data.tipo === 'video' || (data.url && data.url.match(/\.(mp4|webm|ogg|mov)$/i));

        const contenidoMedia = esVideo 
          ? `<video src="${data.url}" controls playsinline class="w-full h-full object-cover"></video>`
          : `<img src="${data.url}" class="w-full h-full object-cover" loading="lazy" alt="Recuerdo de la boda" />`;

        feed.innerHTML += `
          <article class="bg-white border border-rose-100/80 rounded-2xl overflow-hidden shadow-sm transition-all">
            <div class="flex items-center px-4 py-3 space-x-3 bg-white">
              <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-rose-400 to-amber-300 p-[1.5px] flex items-center justify-center">
                <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-rose-800 font-medium text-xs">
                  ${data.nombre.charAt(0).toUpperCase()}
                </div>
              </div>
              <div class="flex-1">
                <p class="text-xs font-semibold text-gray-900 leading-tight">${data.nombre}</p>
                <span class="text-[10px] text-gray-400 font-light">${fechaFormateada}</span>
              </div>
            </div>

            <div class="w-full bg-black/5 aspect-square flex items-center justify-center overflow-hidden">
              ${contenidoMedia}
            </div>

            ${data.mensaje ? `
              <div class="p-4 pt-3 bg-white border-t border-gray-50">
                <p class="text-xs text-gray-700 leading-relaxed">
                  <span class="font-semibold text-gray-900 mr-1.5">${data.nombre}:</span>${data.mensaje}
                </p>
              </div>
            ` : ''}
          </article>
        `;
      });
    });
  </script>
</body>
</html>
